---
# =============================================================================
# CIS OPERATING SYSTEM HARDENING PLAYBOOK
# =============================================================================
- name: Apply CIS Ubuntu 24.04 LTS Hardening Baselines (Direct Root Access)
  hosts: all
  remote_user: root
  gather_facts: yes

  tasks:
    # =========================================================================
    # STAGE 1: CUSTOM INFRASTRUCTURE REALIGNMENT
    # =========================================================================
    # Apply baseline custom fixes including SSH port migration, UFW configurations, and system updates
    - name: Run Custom Ubuntu Hardening Tasks
      ansible.builtin.include_role:
        name: "../roles/ubuntu_hardening"

    # =========================================================================
    # STAGE 2: GLOBAL SECURITY BASTION
    # =========================================================================
    # Execute full DevSec OS Hardening framework for 200+ CIS compliance items and kernel tuning
    - name: Run DevSec OS Hardening Role
      ansible.builtin.include_role:
        name: "../roles/dev-sec.os-hardening"