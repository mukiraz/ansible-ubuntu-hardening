---
# =============================================================================
# SERVER BOOTSTRAP - FINAL VERIFICATION & ROOT LOCKDOWN
# =============================================================================
# Note: User creation and sudoers configuration are handled in the
# push-root-key stage. This role focuses on SSH key verification and
# root account lockdown after hardening is complete.

# =============================================================================
# STEP 1: VERIFY ADMIN USER & SSH CONFIGURATION
# =============================================================================
- name: "BOOTSTRAP | 1.0 - Check if admin user exists"
  ansible.builtin.command: "id {{ bootstrap_username }}"
  register: user_check
  changed_when: false
  tags: [bootstrap_verify]

- name: "BOOTSTRAP | 1.1 - Verify SSH directory exists for admin user"
  ansible.builtin.file:
    path: "/home/{{ bootstrap_username }}/.ssh"
    state: directory
    owner: "{{ bootstrap_username }}"
    group: "{{ bootstrap_username }}"
    mode: '0700'
  tags: [bootstrap_ssh]

- name: "BOOTSTRAP | 1.2 - Verify SSH authorized_keys for the admin user"
  ansible.builtin.authorized_key:
    user: "{{ bootstrap_username }}"
    state: present
    key: "{{ lookup('file', bootstrap_ssh_key_path) }}"
    manage_dir: yes
  tags: [bootstrap_ssh]

# =============================================================================
# STEP 2: FINAL LOCKDOWN - SEAL ROOT ACCOUNT
# =============================================================================
- name: "BOOTSTRAP | 2.0a - Remove SSH key from root's authorized_keys"
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent
  tags: [bootstrap_lockdown]
  ignore_errors: yes

- name: "BOOTSTRAP | 2.0b - Force-remove root authorized_keys file via sudo"
  ansible.builtin.shell: "sudo rm -f /root/.ssh/authorized_keys && sudo chmod 700 /root/.ssh"
  tags: [bootstrap_lockdown]
  changed_when: false
  ignore_errors: yes

- name: "BOOTSTRAP | 2.1 - Lock root account password entirely"
  ansible.builtin.shell: "sudo passwd -l root"
  args:
    executable: /bin/bash
  tags: [bootstrap_lockdown]

- name: "BOOTSTRAP | 2.2 - Confirm root is locked"
  ansible.builtin.shell: "sudo passwd -S root || echo 'Root account locked'"
  register: root_lock_status
  changed_when: false
  tags: [bootstrap_lockdown]

- name: "BOOTSTRAP | 2.3 - Show final verification info"
  ansible.builtin.debug:
    msg: |
      Bootstrap complete!
      - User: {{ bootstrap_username }} (UID: {{ user_check.stdout_lines[0] }})
      - SSH Key: Deployed to /home/{{ bootstrap_username }}/.ssh/authorized_keys
      - Root Lock Status: {{ root_lock_status.stdout }}
  tags: [bootstrap_verify]