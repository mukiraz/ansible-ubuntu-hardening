---
# =============================================================================
# UBUNTU HARDENING ROLE - DEFAULT VARIABLES (Safe & Clean Defaults)
# =============================================================================

# --- 1. OPERATION CONTROL SWITCHES ---
# Toggle core operations within the custom Ubuntu hardening lifecycle
ubuntu_hardening_perform_update: true
ubuntu_hardening_configure_ssh: true
ubuntu_hardening_configure_ufw: true

# --- 2. SSH AND APPLICATION LAYER CONFIGURATIONS ---
# Fallback secure port allocation if not defined in global configurations or .env
ubuntu_hardening_ssh_port: "{{ custom_ssh_port | default('55555', true) }}"

# --- 3. FIREWALL MATRIX CONFIGURATIONS ---
# Dynamic firewall rule mapping to prevent port asymmetry and alignment issues
ubuntu_hardening_firewall_ports: "{{ allowed_firewall_ports | default([
  { 'port': custom_ssh_port | default('55555', true), 'proto': 'tcp', 'comment': 'Secure SSH Port' },
  { 'port': '80', 'proto': 'tcp', 'comment': 'HTTP for Nginx Proxy' },
  { 'port': '443', 'proto': 'tcp', 'comment': 'HTTPS for Nginx Proxy' }
]) }}"

# --- 4. LEGAL AND SECURITY BANNERS ---
# Explicit security banner content for remote pre-login compliance tracking
ubuntu_hardening_banner_text: "WARNING: Authorized access only. All activities are logged and monitored."