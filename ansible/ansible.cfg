[defaults]
roles_path = ./roles
host_key_checking = False
allow_broken_conditionals = True

# Configure Ansible to write temporary files to the current user's home directory instead of /tmp
remote_tmp = ~/.ansible/tmp

# auto_silent: AYNI otomatik keşif (python3.12 vb.), sadece "future interpreter değişebilir"
# uyarısını susturur — sabit bir yol (ör. /usr/bin/python3.12) YAZILMADI çünkü bu tool farklı
# Python sürümlerine sahip hostlar (staging/production, farklı Ubuntu sürümleri) arasında
# taşınabilir kalmalı.
interpreter_python = auto_silent

# vendored roles/dev-sec.os-hardening (upstream, bu repo'ya ait değil) eski `ansible_*` fact
# stiliyle yazılmış — INJECT_FACTS_AS_VARS deprecation uyarısı üçüncü taraf koddan geliyor.
# Upstream uyumluluğunu bozmamak için vendored dosyalar DEĞİL, bu ayar susturuluyor.
deprecation_warnings = False

[ssh_connection]
# GÜVENLİK KRİTİK BULGU: bu ortamda `become` (sudo escalation) modül-tabanlı görevlerde
# (ansible.builtin.user/file/authorized_key vb.) ampirik olarak GÜVENİLMEZ bulundu —
# bağlanan kullanıcı (ANSIBLE_SUDO_USER) NOPASSWD sudo'ya sahip olsa BİLE bir teşhis görevi
# (`whoami`) root DEĞİL bağlanan kullanıcıyı döndürdü. Sebep: pipelining OLMADAN Ansible modülü
# managed node'a GEÇİCİ BİR DOSYA olarak kopyalayıp SONRA çalıştırıyor — become bu
# iki adımlı (kopyala + root olarak çalıştır) süreçte güvenilir şekilde devreye
# giremiyor. Tüketen projenin provisioning ansible.cfg'sinde AYNI ayar zaten vardı (become_user:
# postgres görevlerindeki farklı bir sorunu çözmek için) ve o rollerin become'u
# sorunsuz çalışıyor — kanıt bu. Modülü SSH stdin üzerinden akıtarak (hiç geçici
# dosya yazmadan) bu sorunu kökten ortadan kaldırır.
pipelining = True